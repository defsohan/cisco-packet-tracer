<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .node-box { fill: #0d1b2a; stroke: #2e5a7a; stroke-width: 1.5; rx: 6; }
      .core-box { fill: #0d1b2a; stroke: #3ac0ff; stroke-width: 2; rx: 6; }
      .label { font-family: 'Courier New', monospace; font-size: 12px; fill: #e6edf3; }
      .sublabel { font-family: 'Courier New', monospace; font-size: 10px; fill: #7d94a8; }
      .link { stroke: #3ac0ff; stroke-width: 1.5; }
      .link-dashed { stroke: #7d94a8; stroke-width: 1.2; stroke-dasharray: 4,3; }
      .cloud { fill: #10222f; stroke: #7d94a8; stroke-width: 1.5; }
      .title { font-family: 'Courier New', monospace; font-size: 16px; fill: #3ac0ff; font-weight: bold; }
      .vlan10 { fill: #0d1b2a; stroke: #ffb454; stroke-width: 1.5; rx: 6; }
      .vlan20 { fill: #0d1b2a; stroke: #a8f0c6; stroke-width: 1.5; rx: 6; }
      .vlan30 { fill: #0d1b2a; stroke: #ff8ba8; stroke-width: 1.5; rx: 6; }
    </style>
  </defs>

  <rect width="1000" height="620" fill="#060d15"/>
  <text x="20" y="30" class="title">Enterprise LAN/WAN Topology — VLANs, OSPF, NAT/PAT</text>

  <!-- Internet cloud -->
  <ellipse cx="500" cy="70" rx="90" ry="35" class="cloud"/>
  <text x="500" y="65" text-anchor="middle" class="label">INTERNET</text>
  <text x="500" y="80" text-anchor="middle" class="sublabel">(ISP simulation)</text>

  <!-- R1 Edge Router -->
  <rect x="440" y="140" width="120" height="50" class="core-box"/>
  <text x="500" y="162" text-anchor="middle" class="label">R1 — Edge</text>
  <text x="500" y="177" text-anchor="middle" class="sublabel">NAT/PAT · ACLs</text>
  <line x1="500" y1="105" x2="500" y2="140" class="link"/>

  <!-- R2 Core Router -->
  <rect x="440" y="240" width="120" height="50" class="core-box"/>
  <text x="500" y="262" text-anchor="middle" class="label">R2 — Core</text>
  <text x="500" y="277" text-anchor="middle" class="sublabel">OSPF · Inter-VLAN</text>
  <line x1="500" y1="190" x2="500" y2="240" class="link"/>
  <text x="515" y="220" class="sublabel">203.0.113.0/30</text>

  <!-- Core Switch -->
  <rect x="440" y="330" width="120" height="45" class="node-box"/>
  <text x="500" y="350" text-anchor="middle" class="label">SW1 — Core</text>
  <text x="500" y="364" text-anchor="middle" class="sublabel">Trunk · 802.1Q</text>
  <line x1="500" y1="290" x2="500" y2="330" class="link"/>

  <!-- Access Switches -->
  <rect x="200" y="420" width="120" height="45" class="node-box"/>
  <text x="260" y="440" text-anchor="middle" class="label">SW2 — Access</text>
  <text x="260" y="454" text-anchor="middle" class="sublabel">Port Security</text>
  <line x1="440" y1="352" x2="320" y2="440" class="link-dashed"/>

  <rect x="440" y="420" width="120" height="45" class="node-box"/>
  <text x="500" y="440" text-anchor="middle" class="label">SW3 — Access</text>
  <text x="500" y="454" text-anchor="middle" class="sublabel">Port Security</text>
  <line x1="500" y1="375" x2="500" y2="420" class="link-dashed"/>

  <rect x="680" y="420" width="120" height="45" class="node-box"/>
  <text x="740" y="440" text-anchor="middle" class="label">SW4 — Access</text>
  <text x="740" y="454" text-anchor="middle" class="sublabel">Port Security</text>
  <line x1="560" y1="352" x2="680" y2="440" class="link-dashed"/>

  <!-- VLAN 10 Sales -->
  <rect x="140" y="510" width="240" height="70" class="vlan10"/>
  <text x="260" y="530" text-anchor="middle" class="label">VLAN 10 — Sales</text>
  <text x="260" y="546" text-anchor="middle" class="sublabel">192.168.10.0/24</text>
  <text x="260" y="562" text-anchor="middle" class="sublabel">PC1 · PC2 · PC3</text>
  <line x1="260" y1="465" x2="260" y2="510" class="link"/>

  <!-- VLAN 20 IT -->
  <rect x="440" y="510" width="120" height="70" class="vlan20"/>
  <text x="500" y="530" text-anchor="middle" class="label">VLAN 20 — IT</text>
  <text x="500" y="546" text-anchor="middle" class="sublabel">192.168.20.0/24</text>
  <text x="500" y="562" text-anchor="middle" class="sublabel">PC4 · PC5</text>
  <line x1="500" y1="465" x2="500" y2="510" class="link"/>

  <!-- VLAN 30 Management + Server -->
  <rect x="620" y="510" width="240" height="70" class="vlan30"/>
  <text x="740" y="530" text-anchor="middle" class="label">VLAN 30 — Mgmt / Server</text>
  <text x="740" y="546" text-anchor="middle" class="sublabel">192.168.30.0/24</text>
  <text x="740" y="562" text-anchor="middle" class="sublabel">DHCP/DNS Server · PC6</text>
  <line x1="740" y1="465" x2="740" y2="510" class="link"/>

  <!-- Legend -->
  <text x="20" y="600" class="sublabel">— solid: routed link   ---- trunk/access link   Devices: ~14 (2 routers, 4 switches, 6 PCs, 1 server, 1 AP)</text>
</svg>
